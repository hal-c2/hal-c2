# Tools for the feature runners and `mise run install`; the tasks live in mise-tasks/.
# Qt 6.9+ and cmake come from the system package manager, `vp` from the Vite+
# installer (README.md, "Install vp"). `mise run deps:check` reports all of them.
[tools]
erlang = "29" # the OTP the elixir build below targets
elixir = "1.20.2-otp-29"
node = "24.21.0" # package.json engines ^24.13.1
bun = "1.4.2" # apps/tui engines >=1.3.0
