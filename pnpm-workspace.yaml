packages:
  - apps/*
  - oxlint-plugin-hal-c2
  - packages/*
  - scripts

# Successor to onlyBuiltDependencies/ignoredBuiltDependencies (pnpm 11).
# true = allowed to run build scripts; false mirrors the pnpm 10 behavior
# where anything outside onlyBuiltDependencies was silently not built.
allowBuilds:
  bufferutil: false
  core-js: false
  esbuild: true
  msgpackr-extract: true
  msw: false
  sharp: true
  utf-8-validate: false
  workerd: false

catalog:
  "@effect/platform-node": 4.0.0-rc.115
  "@effect/platform-node-shared": 4.0.0-rc.115
  "@effect/tsgo": 0.41.0
  "@effect/vitest": 4.0.0-rc.115
  "@types/node": 24.12.4
  effect: 4.0.0-rc.115
  typescript: 7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0

minimumReleaseAgeExclude:
  - "@opentui/core-darwin-arm64@0.5.12"
  - "@opentui/core-darwin-x64@0.5.12"
  - "@opentui/core-linux-arm64-musl@0.5.12"
  - "@opentui/core-linux-arm64@0.5.12"
  - "@opentui/core-linux-x64-musl@0.5.12"
  - "@opentui/core-linux-x64@0.5.12"
  - "@opentui/core-win32-arm64@0.5.12"
  - "@opentui/core-win32-x64@0.5.12"
  - "@opentui/core@0.5.12"
  - "@opentui/react@0.5.12"
  - "@effect/platform-node-shared@4.0.0-rc.115"
  - "@effect/platform-node@4.0.0-rc.115"
  - "@effect/vitest@4.0.0-rc.115"
  - effect@4.0.0-rc.115
  - "@shadcn/lint@0.1.5"

overrides:
  "@effect/platform-node": "catalog:"
  "@effect/platform-node-shared": "catalog:"
  "@effect/vitest": "catalog:"
  "@effect/vitest>vitest": "-"
  "@types/node": "catalog:"
  effect: "catalog:"
  vite: "catalog:"
  # Security floors for transitive pins their parents have not raised yet.
  # Drop each one once `pnpm audit` stays clean without it.
  # @vercel/config is written against zod 3 and gets zod 4 here, which is safe
  # only while apps/marketing/vercel.ts imports it for types alone. Drop this
  # floor before anything imports a value from it.
  "@vercel/config>zod": ^4.6.6
  "@vercel/routing-utils>path-to-regexp": 6.3.0
  "shell-quote@<1.11.0": ^1.12.0
  "solid-js@<1.9.18": 1.9.18
  yaml-language-server>yaml: ^2.8.3

packageExtensions:
  "@effect/vitest@*":
    dependencies:
      vite-plus: "catalog:"
    peerDependenciesMeta:
      vitest:
        optional: true
  vite-plus@*:
    dependencies:
      vite: "catalog:"

patchedDependencies:
  "@effect/vitest@4.0.0-rc.115": patches/@effect__vitest@4.0.0-rc.115.patch
  effect@4.0.0-rc.115: patches/effect@4.0.0-rc.115.patch

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"

supportedArchitectures:
  cpu: [current, x64]
  libc: [current, glibc]
  os: [current, linux]
