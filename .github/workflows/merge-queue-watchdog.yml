name: Merge queue watchdog

# Keeps the merge queue moving (.github/scripts/merge-queue-watchdog.sh). GitHub sometimes
# wedges a queue run: the run ends while `CI result` never got a runner, or the run never
# gets a job, and the queue holds the entry and everything behind it for its check timeout.
# This drops such an entry with a comment saying why, and its owner re-queues it. Entries
# ahead of the last one park (ci.yml's `park`): when the last one fails and leaves, this
# starts the new last one's tests, and it cancels runs no entry reads any more.
#
# A queue run that ends is when a wedge or a departure shows; the schedule catches a run
# that never starts, and whatever a missed event left.
#
# A queue run that fails also gets the PR a comment naming the jobs that failed or timed
# out and their failed tests (.github/scripts/merge-queue-report.sh): the queue itself
# only says the PR left it.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  watch:
    name: Drop wedged queue entries
    # A queue run, or a parked entry's run the watchdog started on its queue branch.
    if: github.event_name != 'workflow_run' || startsWith(github.event.workflow_run.head_branch, 'gh-readonly-queue/')
    # Job-level, so a pending watch replacing another never drops a report.
    concurrency:
      group: merge-queue-watchdog
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write # starting a parked entry's tests, cancelling unread runs
      checks: write # answering for the entries ahead of a passed one
      contents: write # dequeuePullRequest
      pull-requests: write # the comment
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - run: .github/scripts/merge-queue-watchdog.sh
        env:
          GH_TOKEN: ${{ github.token }}

  report:
    name: Report a failed queue run on its PR
    if: >-
      github.event_name == 'workflow_run'
      && startsWith(github.event.workflow_run.head_branch, 'gh-readonly-queue/')
      && github.event.workflow_run.conclusion != 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: write # the comment
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - run: .github/scripts/merge-queue-report.sh "$RUN_ID" "$RUN_ATTEMPT" "$QUEUE_BRANCH"
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          QUEUE_BRANCH: ${{ github.event.workflow_run.head_branch }}
