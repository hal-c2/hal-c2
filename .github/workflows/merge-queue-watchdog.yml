name: Merge queue watchdog

# Keeps the merge queue moving (.github/scripts/merge-queue-watchdog.sh). GitHub sometimes
# wedges a queue run: the run ends while `CI result` never got a runner, or the run never
# gets a job, and the queue holds the entry and everything behind it for its check timeout.
# This drops such an entry with a comment saying why, and its owner re-queues it. Entries
# ahead of the last one park (ci.yml's `park`): when an entry fails, this tests every parked
# one ahead of it at once to find the culprit, and it cancels runs no entry reads any more.
#
# A queue run that ends is when a wedge or a departure shows. GitHub sends no workflow_run
# for a run GITHUB_TOKEN started, so a promoted one dispatches this itself as it ends
# (ci.yml's `follow`). The schedule catches a run that never starts, and whatever a missed
# event left, but GitHub may go hours without running it.
#
# A queue run that fails also gets the PR a comment naming the jobs that failed or timed
# out and their failed tests (.github/scripts/merge-queue-report.sh): the queue itself
# only says the PR left it.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      run:
        description: A failed promoted run to report on its PR (ci.yml's `follow` sets these)
      attempt:
        description: That run's attempt
      branch:
        description: That run's queue branch

permissions: {}

jobs:
  watch:
    name: Drop wedged queue entries
    # A merge group's run. By event: a fork can give its PR's branch any name.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.event == 'merge_group'
    # Job-level, so a pending watch replacing another never drops a report.
    concurrency:
      group: merge-queue-watchdog
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write # starting a parked entry's tests, cancelling unread runs
      checks: write # answering for the entries ahead of a passed one
      contents: write # dequeuePullRequest
      pull-requests: write # the comment
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - run: .github/scripts/merge-queue-watchdog.sh
        env:
          GH_TOKEN: ${{ github.token }}

  report:
    name: Report a failed queue run on its PR
    if: >-
      (github.event_name == 'workflow_run'
      && github.event.workflow_run.event == 'merge_group'
      && github.event.workflow_run.conclusion != 'success')
      || (github.event_name == 'workflow_dispatch' && inputs.run != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: write # the comment
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - run: .github/scripts/merge-queue-report.sh "$RUN_ID" "$RUN_ATTEMPT" "$QUEUE_BRANCH"
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id || inputs.run }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt || inputs.attempt }}
          QUEUE_BRANCH: ${{ github.event.workflow_run.head_branch || inputs.branch }}
