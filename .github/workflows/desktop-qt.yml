name: desktop-qt

on:
  push:
    branches:
      - main
    paths: &paths
      - "apps/desktop-qt/**"
      - "apps/server-ex/**"
      - "apps/web/**"
      - "features/**"
      - "packages/**"
      - "patches/**"
      - "assets/prod/black-universal-1024.png"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "vite.config.ts"
      - ".github/workflows/desktop-qt.yml"
  pull_request:
    paths: *paths
  workflow_dispatch:
    inputs:
      macos:
        description: "Also build and test on macOS"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # macOS runs only when dispatched with `macos`: its minutes cost ten
        # times Linux's.
        os: ${{ fromJSON(inputs.macos && '["ubuntu-24.04", "macos-15"]' || '["ubuntu-24.04"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          # The web app's packages feed the licence manifest
          # (third-party-licenses.ts); the MC release bundles the Cursor
          # sidecar with that package's esbuild (apps/server-ex/mix.exs); the
          # host's tests and typecheck need its own.
          run-install: |
            args:
              - --filter=@hal-c2/web...
              - --filter=@hal-c2/cursor-acp...
              - --filter=@hal-c2/desktop-qt...

      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.9.*"
          host: ${{ runner.os == 'macOS' && 'mac' || 'linux' }}
          arch: ${{ runner.os == 'macOS' && 'clang_64' || 'linux_gcc_64' }}
          modules: qtwebsockets
          cache: true

      # FFmpeg's headers build the Device tab's H.264 decoding
      # (cmake/NativeShell.cmake). Nothing links FFmpeg, so the bundlers below
      # do not ship it: the app loads the user's own at run time.
      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl1-mesa-dev libxkbcommon-dev libfuse2 \
            libxcb-cursor0 pkg-config libavcodec-dev libavutil-dev libswscale-dev dbus

      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja pkg-config ffmpeg

      # The first configure builds libghostty-vt (the terminal drawer's
      # emulator) with Zig from a Ghostty checkout; both are cached here, and
      # Zig's own cache holds Ghostty's dependencies.
      - name: Cache libghostty-vt toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/qml-ghostty
            ~/.cache/zig
          key: qml-ghostty-${{ runner.os }}-${{ hashFiles('native/libghostty-vt/VERSION') }}

      - name: Configure
        run: >
          cmake -S apps/desktop-qt -B apps/desktop-qt/build/release -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="${{ env.QT_ROOT_DIR }}"

      - name: Build
        run: cmake --build apps/desktop-qt/build/release

      - name: Setup Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          elixir-version: "1.20.3"

      # The MC the desktop app starts (host/elixirMc.ts), staged as hal-c2-mc/.
      - name: Build MC release
        working-directory: apps/server-ex
        env:
          MIX_ENV: prod
        run: |
          mix deps.get --only prod
          mix release --overwrite

      - name: Test native
        run: |
          cmake -S apps/desktop-qt/tests/native -B apps/desktop-qt/build/tests/native -G Ninja \
            -DCMAKE_PREFIX_PATH="${QT_ROOT_DIR}"
          cmake --build apps/desktop-qt/build/tests/native
          ctest --test-dir apps/desktop-qt/build/tests/native --output-on-failure

      - name: Test QML
        run: node apps/desktop-qt/scripts/test-qml.mjs

      - name: Test and typecheck host
        run: |
          vp run --filter @hal-c2/desktop-qt test
          vp run --filter @hal-c2/desktop-qt typecheck

      - name: Package (Linux AppImage)
        if: runner.os == 'Linux'
        run: apps/desktop-qt/scripts/package-linux.sh apps/desktop-qt/build/release

      - name: Package (macOS app bundle)
        if: runner.os == 'macOS'
        run: apps/desktop-qt/scripts/package-macos.sh apps/desktop-qt/build/release

      - uses: actions/upload-artifact@v4
        with:
          name: hal-c2-qt-${{ matrix.os }}
          path: |
            apps/desktop-qt/build/release/*.AppImage
            apps/desktop-qt/build/release/*.zip
          if-no-files-found: error
