name: desktop-qt

on:
  push:
    paths:
      - "apps/desktop-qt/**"
      - "apps/server-ex/**"
      - "apps/web/**"
      - "packages/**"
      - "patches/**"
      - "assets/prod/black-universal-1024.png"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "vite.config.ts"
      - ".github/workflows/desktop-qt.yml"
  pull_request:
    paths:
      - "apps/desktop-qt/**"
      - "apps/server-ex/**"
      - "apps/web/**"
      - "packages/**"
      - "patches/**"
      - "assets/prod/black-universal-1024.png"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "vite.config.ts"
      - ".github/workflows/desktop-qt.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            qt_host: linux
            qt_arch: linux_gcc_64
          - os: macos-15
            qt_host: mac
            qt_arch: clang_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          # The web app's packages feed the licence manifest
          # (third-party-licenses.ts); the node release bundles the Cursor
          # sidecar with that package's esbuild (apps/server-ex/mix.exs).
          run-install: |
            args:
              - --filter=@hal-c2/web...
              - --filter=@hal-c2/cursor-acp...

      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.9.*"
          host: ${{ matrix.qt_host }}
          arch: ${{ matrix.qt_arch }}
          modules: qtwebsockets
          cache: true

      # FFmpeg's headers build the Device tab's H.264 decoding
      # (cmake/NativeShell.cmake). Nothing links FFmpeg, so the bundlers below
      # do not ship it: the app loads the user's own at run time.
      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl1-mesa-dev libxkbcommon-dev libfuse2 \
            libxcb-cursor0 pkg-config libavcodec-dev libavutil-dev libswscale-dev

      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja pkg-config ffmpeg

      # The first configure builds libghostty-vt (the terminal drawer's
      # emulator) with Zig from a Ghostty checkout; both are cached here, and
      # Zig's own cache holds Ghostty's dependencies.
      - name: Cache libghostty-vt toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/qml-ghostty
            ~/.cache/zig
          key: qml-ghostty-${{ runner.os }}-${{ hashFiles('native/libghostty-vt/VERSION') }}

      - name: Configure
        run: >
          cmake -S apps/desktop-qt -B apps/desktop-qt/build/release -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="${{ env.QT_ROOT_DIR }}"

      - name: Build
        run: cmake --build apps/desktop-qt/build/release

      - name: Setup Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          elixir-version: "1.20.3"

      # The node the desktop app starts (host/elixirNode.ts), staged as hal-c2-node/.
      - name: Build node release
        working-directory: apps/server-ex
        env:
          MIX_ENV: prod
        run: |
          mix deps.get --only prod
          mix release --overwrite

      - name: Test QML
        run: node apps/desktop-qt/scripts/test-qml.mjs

      - name: Package (Linux AppImage)
        if: runner.os == 'Linux'
        run: apps/desktop-qt/scripts/package-linux.sh apps/desktop-qt/build/release

      - name: Package (macOS app bundle)
        if: runner.os == 'macOS'
        run: |
          node apps/desktop-qt/scripts/stage-runtime.mjs apps/desktop-qt/build/release/hal-c2-qt.app/Contents/Resources/hal-c2
          "${QT_ROOT_DIR}/bin/macdeployqt" apps/desktop-qt/build/release/hal-c2-qt.app -qmldir=apps/desktop-qt/qml
          ditto -c -k --keepParent apps/desktop-qt/build/release/hal-c2-qt.app apps/desktop-qt/build/release/hal-c2-qt-macos.zip

      - uses: actions/upload-artifact@v4
        with:
          name: hal-c2-qt-${{ matrix.os }}
          path: |
            apps/desktop-qt/build/release/*.AppImage
            apps/desktop-qt/build/release/*.zip
          if-no-files-found: error
