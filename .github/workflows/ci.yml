name: CI

# The MC (apps/server-ex) and the TUI (apps/tui). The Qt desktop builds and
# tests in desktop-qt.yml. The legacy Node server, web, Electron and React Native
# apps have no CI of their own; desktop-qt.yml still builds the web app it hosts.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pr_assets:
    name: PR assets
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: .github
          persist-credentials: false

      - name: Reject repository-owned PR assets
        run: |
          files="$(git ls-files .github/pr-assets)"
          if test -n "$files"; then
            printf 'PR evidence must be uploaded to GitHub, not committed:\n%s\n' "$files" >&2
            exit 1
          fi

  mc:
    name: MC (server-ex)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MIX_ENV: test
    defaults:
      run:
        working-directory: apps/server-ex
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Setup Elixir
        id: beam
        uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          elixir-version: "1.20.3"

      - name: Cache Mix deps and build
        uses: actions/cache@v6
        with:
          path: |
            apps/server-ex/deps
            apps/server-ex/_build
          key: mix-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('apps/server-ex/mix.lock') }}
          restore-keys: mix-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-

      - name: Fetch deps
        run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile
        run: mix compile --warnings-as-errors

      - name: Git identity for test repositories
        run: git config --global user.name CI && git config --global user.email ci@example.com

      - name: Test
        run: mix test

      # GPL-3.0 (PropCheck), so in their own environment: apps/server-ex/prop/README.md.
      - name: Property tests
        run: mix prop
        env:
          MIX_ENV: prop

  # The @mc scenarios of features/, one directory per job so a slow or hung
  # directory stays visible; mc/ is split in two to fit the time limit.
  # HAL_C2_FEATURES without `--only cucumber` keeps @backlog out (test_helper.exs);
  # naming scenarios_test.exs keeps the unit suite, which the mc job runs, out.
  # Add a directory here when it gains @mc scenarios.
  mc_scenarios:
    name: MC scenarios (${{ matrix.dir }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        dir:
          - composer
          - connections
          - files
          - navigation
          - mc/orchestration
          - mc/platform
          - parity
          - plugins
          - preview
          - providers
          - settings
          - source-control
          - terminal
          - threads
          - timeline
    env:
      MIX_ENV: test
    defaults:
      run:
        working-directory: apps/server-ex
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Setup Elixir
        id: beam
        uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          elixir-version: "1.20.3"

      # The parity steps read packages/contracts' RPC schemas with Bun
      # (test/support/contract_keys.ts) when they compile, and drive
      # packages/client-runtime's protocol 3 adapter (v3_unsupported_call.ts).
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@hal-c2/contracts...
              - --filter=@hal-c2/client-runtime...

      # Keep in step with mise.toml.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Restore Mix deps and build
        uses: actions/cache/restore@v6
        with:
          path: |
            apps/server-ex/deps
            apps/server-ex/_build
          key: mix-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('apps/server-ex/mix.lock') }}
          restore-keys: mix-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-

      - name: Fetch deps
        run: mix deps.get

      - name: Git identity for test repositories
        run: git config --global user.name CI && git config --global user.email ci@example.com

      # The terminal scenarios open zsh, which the runner image lacks.
      - name: Install zsh
        if: matrix.dir == 'terminal'
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Scenarios
        env:
          HAL_C2_FEATURES: "${{ matrix.dir }}/**/*.feature"
        run: mix test test/hal_c2/scenarios_test.exs

  tui:
    name: TUI
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      # Keep in step with mise.toml.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Check formatting (TUI, Qt host, Cursor sidecar)
        run: vp fmt --check apps/tui apps/desktop-qt packages/cursor-acp

      - name: Lint (TUI, Qt host, Cursor sidecar)
        run: vp lint apps/tui apps/desktop-qt packages/cursor-acp

      - name: Typecheck
        run: vp run --filter @hal-c2/tui typecheck

      - name: Test
        working-directory: apps/tui
        run: bun test

      - name: "@tui and @shared scenarios"
        working-directory: apps/tui
        env:
          MISE_CONFIG_ROOT: ${{ github.workspace }}
        run: ../../mise-tasks/features/tui/all
