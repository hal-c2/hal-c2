name: CI

# The MC (apps/server-ex) and the TUI (apps/tui). The Qt desktop builds and
# tests in desktop-qt.yml.
#
# Cheapest first: `changes` picks the jobs a commit needs, and nothing of the MC's starts
# until mc_check has passed, so a formatting slip costs a minute, not every runner the
# repository may use at once. A job that fails can be re-run alone.
#
# A push to a pull request runs only the quick tier (mc_check, unit tests, the TUI): pushes
# come often and each cancels the last, so a slow job there mostly runs on a commit no one
# will merge. Properties, proofs and scenarios run once, in the merge queue, on the commit
# that lands. A merge to main runs only mc_check, to save its build for pull requests.
# `CI result` is the one check main's ruleset requires.

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main
  # Every job, proofs included, whatever changed: what no commit changes (the runner image,
  # a flake in a proof) still gets looked at. Not Maude's latest release, which `mix proof`
  # installs only if the build it restored has none.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      mc: ${{ steps.changes.outputs.mc }}
      unit: ${{ steps.changes.outputs.unit }}
      props: ${{ steps.changes.outputs.props }}
      tui: ${{ steps.changes.outputs.tui }}
      scenarios: ${{ steps.changes.outputs.scenarios }}
      named: ${{ steps.changes.outputs.named }}
      proofs: ${{ steps.changes.outputs.proofs }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
          filter: blob:none
          sparse-checkout: .github
          persist-credentials: false

      # A queue entry's HEAD^1 is the PR's last commit when the queue rebases, and in a
      # group only the last entry runs: diff against what the queue builds on instead.
      - if: github.event_name == 'merge_group'
        run: git fetch --no-tags --depth=1 --filter=blob:none origin "$BASE" && echo "CI_BASE=$BASE" >>"$GITHUB_ENV"
        env:
          BASE: ${{ github.event.merge_group.base_sha }}

      - id: changes
        # Naming the shell turns on pipefail. Without it a failed script is tee's success:
        # no outputs, every job skipped, and a run that tested nothing looks clean.
        shell: bash
        run: .github/scripts/ci-changes.sh ${{ github.event_name == 'pull_request' && 'pr' || github.event_name == 'merge_group' && 'queue' || github.event_name == 'push' && 'merged' || 'all' }} | tee -a "$GITHUB_OUTPUT"

  pr_assets:
    name: PR assets
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: .github
          persist-credentials: false

      - name: Reject repository-owned PR assets
        run: |
          files="$(git ls-files .github/pr-assets)"
          if test -n "$files"; then
            printf 'PR evidence must be uploaded to GitHub, not committed:\n%s\n' "$files" >&2
            exit 1
          fi

  # The ledger claims only what a runner selects: every @desktop/@mobile
  # scenario without a backlog tag must be named by that surface's
  # kDefaultGlobs. Cheap enough to run on every change, including ones
  # that touch only the native runners' glob lists.
  ledger:
    name: Ledger check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Claimed desktop/mobile scenarios are selected by their runners
        run: python3 mise-tasks/features/check


  # The one job that saves the build every other MC job restores.
  mc_check:
    name: MC check
    needs: changes
    if: needs.changes.outputs.mc == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MIX_ENV: test
    defaults:
      run:
        working-directory: apps/server-ex
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup the MC
        id: mc
        uses: ./.github/actions/setup-mc

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile
        run: mix compile --warnings-as-errors

      # Waits in code a hot update changes, against credo/waits_baseline.exs.
      - name: Credo
        run: mix credo

      - name: Compile the property tests
        run: mix compile
        env:
          MIX_ENV: prop

      # Takes Maude only to read the models; no model checking. The test is a drift check:
      # the code against what each model says it covers, which every change can break.
      - name: The models still cover the code
        run: mix proof --only "test:test the model covers the code"
        env:
          MIX_ENV: proof
          # maude.install asks the GitHub API for releases; unauthenticated, runners hit its rate limit.
          GITHUB_TOKEN: ${{ github.token }}

      # Only main's, which every branch can restore; a pull request's serves that pull
      # request alone, and fills the repository's 10 GB with copies of main's.
      - name: Save deps, build and Maude
        if: github.ref == 'refs/heads/main' && steps.mc.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            apps/server-ex/deps
            apps/server-ex/_build
          key: ${{ steps.mc.outputs.cache-key }}

  # Its own job, so an advisory published against a dep fails this, not the tests; the
  # nightly run is what catches one between changes. Not on a merge to main, which runs
  # only mc_check: its pull request ran this.
  mc_audit:
    name: MC security audit
    needs: [changes, mc_check]
    if: needs.changes.outputs.mc == 'true' && github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      MIX_ENV: test
    defaults:
      run:
        working-directory: apps/server-ex
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup the MC
        uses: ./.github/actions/setup-mc

      - name: Retired packages
        run: mix hex.audit

      - name: Dependency advisories
        run: mix deps.audit

      # Fails only on findings sobelow_baseline.txt lacks (scripts/sobelow_check.exs).
      - name: Sobelow against its baseline
        run: mix sobelow.check


  mc:
    name: MC tests
    needs: [changes, mc_check]
    if: needs.changes.outputs.unit == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MIX_ENV: test
    defaults:
      run:
        working-directory: apps/server-ex
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup the MC
        uses: ./.github/actions/setup-mc

      # The tests that mount another machine's folder skip without it (HalC2.MachineFiles).
      # Regex content search needs ripgrep, which the runner image lacks (HalC2.Workspace).
      - name: Install fuse3 and ripgrep
        timeout-minutes: 10
        run: '"$GITHUB_WORKSPACE"/.github/scripts/apt-install.sh fuse3 ripgrep'

      - name: Build the machine-files helper
        run: |
          cargo build --locked --release --manifest-path ../../native/machine-files/Cargo.toml

      # The orphan reaper kills through it, and with `kill` without it (HalC2.Subprocess.Orphans).
      - name: Test the pid-kill helper
        run: |
          cargo test --locked --manifest-path ../../native/pid-kill/Cargo.toml
          cargo build --locked --release --manifest-path ../../native/pid-kill/Cargo.toml

      # HalC2.Mermaid draws with it; its tests skip without it.
      - name: Test the Mermaid helper
        run: |
          cargo fmt --check --manifest-path ../../native/mermaid/Cargo.toml
          cargo test --locked --manifest-path ../../native/mermaid/Cargo.toml
          cargo build --locked --release --manifest-path ../../native/mermaid/Cargo.toml

      - name: Test
        run: mix test


  # The matrix jobs' names leave the matrix out: GitHub appends its values to a running
  # job's name, and shows a skipped job's `${{ matrix.* }}` unexpanded.
  # GPL-3.0 (PropCheck), so in their own environment: apps/server-ex/prop/README.md.
  # They run the real code on sampled cases and take half an hour, split by file so one
  # failed property re-runs a part of that. New files join a partition on their own.
  # ExUnit deals the files to partitions round-robin by name, blind to their cost, so the
  # planner's, about eight minutes alone, runs in a shard of its own: the partition that
  # drew it with the next heaviest files ran into the job's limit (#1487's merge group).
  mc_props:
    name: MC properties
    needs: [changes, mc_check]
    if: needs.changes.outputs.props == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      # In the queue one failure decides the entry; on a pull request, see them all.
      fail-fast: ${{ github.event_name == 'merge_group' }}
      matrix:
        shard: [1, 2, 3, planner]
    env:
      MIX_ENV: prop
    defaults:
      run:
        working-directory: apps/server-ex
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup the MC
        uses: ./.github/actions/setup-mc

      - name: Install fuse3
        timeout-minutes: 10
        run: '"$GITHUB_WORKSPACE"/.github/scripts/apt-install.sh fuse3'

      - name: Build the machine-files helper
        run: |
          cargo build --locked --release --manifest-path ../../native/machine-files/Cargo.toml

      - name: Build the pid-kill helper
        run: cargo build --locked --release --manifest-path ../../native/pid-kill/Cargo.toml

      - name: Property tests
        run: |
          if [ "$SHARD" = planner ]; then
            mix prop prop/hal_c2/planner_prop_test.exs
          else
            MIX_TEST_PARTITION="$SHARD" mix prop --partitions 3 --exclude module:HalC2.PlannerPropTest
          fi
        env:
          SHARD: ${{ matrix.shard }}


  # Maude is GPL and installed by `mix proof`, never shipped: apps/server-ex/proof/README.md.
  # Only the proofs whose model changed (ci-changes.sh); mc_check holds every model to the
  # code. One job per proof, as model checking peaks at several GB and a proof's checks
  # run one after another.
  mc_proofs:
    name: MC proofs
    needs: [changes, mc_check]
    if: needs.changes.outputs.proofs != '[]'
    runs-on: ubuntu-24.04
    # code_review_claims has taken from 13 to over 37 minutes on the same model, and its
    # slowest search may use 30 of them (its proof's `timeout`).
    timeout-minutes: 60
    strategy:
      # In the queue one failure decides the entry; on a pull request, see them all.
      fail-fast: ${{ github.event_name == 'merge_group' }}
      matrix:
        proof: ${{ fromJSON(needs.changes.outputs.proofs) }}
    env:
      MIX_ENV: proof
    defaults:
      run:
        working-directory: apps/server-ex
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup the MC
        uses: ./.github/actions/setup-mc

      - name: Proofs
        run: mix proof proof/hal_c2/${{ matrix.proof }}_proof_test.exs
        env:
          # maude.install asks the GitHub API for releases; unauthenticated, runners hit its rate limit.
          GITHUB_TOKEN: ${{ github.token }}

  # The @mc scenarios of features/, in the groups ci-changes.sh defines and selects.
  # HAL_C2_FEATURES without `--only cucumber` keeps @backlog out (test_helper.exs);
  # naming scenarios_test.exs keeps the unit suite, which the mc job runs, out.
  mc_scenarios:
    name: MC scenarios
    needs: [changes, mc_check]
    if: needs.changes.outputs.scenarios != '[]'
    runs-on: ubuntu-24.04
    # The mc/orchestration shard runs about 1,650 scenarios in about 23 minutes; split it in .github/scripts/ci-changes.sh before this limit is reached.
    timeout-minutes: 40
    strategy:
      # In the queue one failure decides the entry; on a pull request, see them all.
      fail-fast: ${{ github.event_name == 'merge_group' }}
      matrix:
        dirs: ${{ fromJSON(needs.changes.outputs.scenarios) }}
    env:
      MIX_ENV: test
      NAMED: ${{ needs.changes.outputs.named }}
    defaults:
      run:
        working-directory: apps/server-ex
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # The parity steps read packages/contracts' RPC schemas with Bun
      # (test/support/contract_keys.ts) when they compile, and drive
      # packages/client-runtime's protocol 3 adapter (v3_unsupported_call.ts).
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@hal-c2/contracts...
              - --filter=@hal-c2/client-runtime...

      # Keep in step with mise.toml.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Setup the MC
        uses: ./.github/actions/setup-mc

      # The terminal scenarios open zsh, which the runner image lacks.
      - name: Install zsh
        if: contains(matrix.dirs, 'terminal')
        timeout-minutes: 10
        run: '"$GITHUB_WORKSPACE"/.github/scripts/apt-install.sh zsh'

      # Files on another machine mount them with FUSE; they skip without the helper.
      # Regex content search needs ripgrep, which the runner image lacks.
      - name: Install fuse3 and ripgrep
        if: contains(matrix.dirs, 'files')
        timeout-minutes: 10
        run: '"$GITHUB_WORKSPACE"/.github/scripts/apt-install.sh fuse3 ripgrep'

      - name: Build the machine-files helper
        if: contains(matrix.dirs, 'files')
        run: |
          cargo build --locked --release --manifest-path ../../native/machine-files/Cargo.toml

      # space/diagrams.feature draws with the real helper.
      - name: Build the Mermaid helper
        if: matrix.dirs == 'rest'
        run: cargo build --locked --release --manifest-path ../../native/mermaid/Cargo.toml

      - name: Scenarios
        env:
          DIRS: ${{ matrix.dirs }}
        run: |
          if [ "$DIRS" = rest ]; then
            globs=$(cd ../../features && find . -name '*.feature' -printf '%h\n' | sed 's|^\./||' | sort -u \
              | grep -vE "^($NAMED)(/|$)" | sed 's|$|/*.feature|' | paste -sd,)
          else
            globs=$(printf '%s/**/*.feature\n' $DIRS | paste -sd,)
          fi
          echo "$globs"
          HAL_C2_FEATURES="$globs" mix test test/hal_c2/scenarios_test.exs


  tui:
    name: TUI
    needs: changes
    if: needs.changes.outputs.tui == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      # Keep in step with mise.toml.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Check formatting (TUI, Qt host, Cursor sidecar)
        run: vp fmt --check apps/tui apps/desktop-qt packages/cursor-acp

      - name: Lint (TUI, Qt host, Cursor sidecar)
        run: vp lint apps/tui apps/desktop-qt packages/cursor-acp

      - name: Typecheck
        run: vp run --filter @hal-c2/tui typecheck

      - name: Test
        working-directory: apps/tui
        run: bun test

      # Some scenarios run against a real MC (apps/tui/features/support/realMc.ts).
      - name: Setup the MC
        uses: ./.github/actions/setup-mc

      - name: Compile the MC
        working-directory: apps/server-ex
        env:
          MIX_ENV: test
        run: mix compile

      - name: "@tui and @shared scenarios"
        working-directory: apps/tui
        env:
          MISE_CONFIG_ROOT: ${{ github.workspace }}
        run: ../../mise-tasks/features/tui/all


  # In the queue the first failure decides the entry: these stop the rest of the run so the
  # queue drops it now, not when the slowest proof ends. They hold the run's only write
  # permission, as they run no project code and no third-party action: every other job
  # does, and setup-beam takes the token by default. One per job, since `needs` waits for
  # every job it lists.
  stop_assets:
    name: Stop the queue run (PR assets)
    needs: pr_assets
    if: failure() && github.event_name == 'merge_group'
    permissions: &stop-permissions
      actions: write
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps: &stop-steps
      - run: gh run cancel "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}

  stop_ledger:
    name: Stop the queue run (Ledger check)
    needs: ledger
    if: failure() && github.event_name == 'merge_group'
    permissions: *stop-permissions
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps: *stop-steps

  stop_audit:
    name: Stop the queue run (MC audit)
    needs: mc_audit
    if: failure() && github.event_name == 'merge_group'
    permissions: *stop-permissions
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps: *stop-steps

  stop_tui:
    name: Stop the queue run (TUI)
    needs: tui
    if: failure() && github.event_name == 'merge_group'
    permissions: *stop-permissions
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps: *stop-steps

  stop_mc:
    name: Stop the queue run (MC tests)
    needs: mc
    if: failure() && github.event_name == 'merge_group'
    permissions: *stop-permissions
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps: *stop-steps

  stop_props:
    name: Stop the queue run (MC properties)
    needs: mc_props
    if: failure() && github.event_name == 'merge_group'
    permissions: *stop-permissions
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps: *stop-steps

  stop_proofs:
    name: Stop the queue run (MC proofs)
    needs: mc_proofs
    if: failure() && github.event_name == 'merge_group'
    permissions: *stop-permissions
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps: *stop-steps

  stop_scenarios:
    name: Stop the queue run (MC scenarios)
    needs: mc_scenarios
    if: failure() && github.event_name == 'merge_group'
    permissions: *stop-permissions
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps: *stop-steps

  # The check main's ruleset requires, since the jobs above vary with the change and matrix
  # entries change their names. A skipped job passes; a failed or cancelled one does not.
  result:
    name: CI result
    needs: [changes, pr_assets, ledger, mc_check, mc_audit, mc, mc_props, mc_proofs, mc_scenarios, tui]
    # Also after a cancel in the queue, which the stop jobs cause: the queue needs an answer.
    if: ${{ always() && (github.event_name == 'merge_group' || !cancelled()) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          failed=$(jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key): \(.value.result)"' <<<"$NEEDS")
          if [ -n "$failed" ]; then echo "$failed" >&2; exit 1; fi
