name: Install apt packages
description: Installs apt packages from .debs kept in the Actions cache, and downloads them only when the cache lacks them or they don't install (.github/scripts/apt-install.sh).

inputs:
  packages:
    description: The packages, separated by spaces.
    required: true

runs:
  using: composite
  steps:
    # By release, not runner image version: a new image every week would make every job
    # download again, and an older .deb of these still installs on a newer image. A key
    # can't be overwritten, so each save takes the run's own, and a restore the newest
    # under the prefix; `/` ends the package list, as no package name holds one.
    - name: Cache key
      id: key
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
      run: |
        . /etc/os-release
        echo "prefix=apt-v2-$ID-$VERSION_CODENAME-$RUNNER_ARCH-${PACKAGES// /+}/" >> "$GITHUB_OUTPUT"
        echo "dir=$RUNNER_TEMP/apt-${PACKAGES// /+}" >> "$GITHUB_OUTPUT"

    - name: Restore the .debs
      uses: actions/cache/restore@v6
      with:
        path: ${{ steps.key.outputs.dir }}
        key: ${{ steps.key.outputs.prefix }}${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: ${{ steps.key.outputs.prefix }}

    - name: Install
      id: install
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
        DEBS: ${{ steps.key.outputs.dir }}
      # $PACKAGES unquoted: one argument per package.
      run: '"$GITHUB_ACTION_PATH"/../../scripts/apt-install.sh "$DEBS" $PACKAGES'

    # On a cold cache, and on a stale one whose .debs didn't install.
    - name: Save the .debs
      if: steps.install.outputs.fetched == 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ steps.key.outputs.dir }}
        key: ${{ steps.key.outputs.prefix }}${{ github.run_id }}-${{ github.run_attempt }}
