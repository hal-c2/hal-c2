# Its own workspace beside desktop-ljos's: a member outside that
# workspace's root cannot inherit from it, so the pins desktop-ljos
# builds Ljós at are spelled out here and follow
# apps/desktop-ljos/Cargo.toml's when they move.
[workspace]

[package]
name = "hal_c2_mobile"
description = "The HAL-C2 phone shell on Ljós: mobile-qt's HalC2.Mobile over desktop-ljos's HalC2.Shell."
version = "0.0.1"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false
default-run = "hal-c2-mobile-ljos"

[[bin]]
name = "hal-c2-mobile-ljos"
path = "src/main.rs"

# The phone's Gherkin scenarios (features/mobile/) against this shell; see
# tests/features/main.rs. Opt-in, as desktop-ljos's: `cargo test` skips it,
# `mise run features:mobile-ljos` runs it with `--test features`.
[[test]]
name = "features"
path = "tests/features/main.rs"
harness = false
test = false

[features]
# Ljós's inspector, as the desktop shell's (LJOS_MCP).
mcp = ["hal_c2_shell/mcp"]
# Compiles the QML from the checkout's directories at start-up instead
# of running the pack build.rs made, as the desktop shell's: for
# development only; a release runs the pack, with the user's `<config>`
# files over it (user-qml).
dev-qml = ["hal_c2_shell/dev-qml", "ljos/dev-qml"]

[dependencies]
# The desktop shell as it is: its controllers, its MC client and the
# native HalC2.Shell under the bricks. The phone adds its own controllers
# (src/) and its QML root (qml/, over apps/mobile-qt/qml).
hal_c2_shell = { path = "../desktop-ljos/shell" }
hal_c2_mc = { path = "../desktop-ljos/mc" }
# The app, its window and `--render`, as the desktop shell's main uses
# them; pinned as desktop-ljos pins Ljós. user-qml: the app runs the
# QML build.rs compiled (its pack), with the user's files in the config
# dir laid over it (src/main.rs).
ljos = { git = "https://github.com/hal-c2/ljos-ui", rev = "10ec7bc69e59b287df69b27609a6485ebfe15d53", default-features = false, features = ["shell", "user-qml", "render"] }
# `--render`'s host for the shell's `Window`, as the desktop shell's
# main: a window of its own, where its popups find their overlay.
ljos_controls = { git = "https://github.com/hal-c2/ljos-ui", rev = "10ec7bc69e59b287df69b27609a6485ebfe15d53" }
# Whether the browser tabs can draw here at all (main's one question).
ljos_webengine = { git = "https://github.com/hal-c2/ljos-ui", rev = "10ec7bc69e59b287df69b27609a6485ebfe15d53", features = ["cef"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# A pairing link's origin, as hal_c2_mc takes it.
url = "2"
# The credential's expiry the MC renews by (pairing.json's expiresAt).
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# build.rs: the phone's QML compiled into its pack, and its bindings
# and handlers to Rust, as desktop-ljos's.
[build-dependencies]
ljos = { git = "https://github.com/hal-c2/ljos-ui", rev = "10ec7bc69e59b287df69b27609a6485ebfe15d53", default-features = false, features = ["build"] }

[dev-dependencies]
# The encoder the desktop draws its codes with, for the round trip.
qrcodegen = "1"
# `testing`: a window without a platform, on a virtual clock, for the
# features harness's touches.
ljos = { git = "https://github.com/hal-c2/ljos-ui", rev = "10ec7bc69e59b287df69b27609a6485ebfe15d53", default-features = false, features = ["testing"] }
# The state machine properties (the pairing's, the terminal row's).
proptest = "1.11"
tempfile = "3"
# The step patterns, as desktop-ljos's harness reads them.
fancy-regex = "0.19"

# The features runner's own runtime directory (tests/features/main.rs).
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true

# The Terminal's VT parser is the hot path even in a debug build (see
# apps/desktop-ljos/Cargo.toml).
[profile.dev.package.libghostty-vt-sys]
opt-level = 3
debug = false
