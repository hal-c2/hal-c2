[workspace]
members = ["shell", "mc"]
resolver = "3"

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false

[workspace.dependencies]
# Pinned to a commit of hal-c2/ljos-ui. To build against a local checkout,
# add a `[patch."https://github.com/hal-c2/ljos-ui"]` to a gitignored
# .cargo/config.toml rather than editing this line.
ljos = { git = "https://github.com/hal-c2/ljos-ui", rev = "53157b350adbbf8f7e3e3a7d7b961f7a45c03295", default-features = false }
ljos_quick3d = { git = "https://github.com/hal-c2/ljos-ui", rev = "53157b350adbbf8f7e3e3a7d7b961f7a45c03295" }
ljos_webengine = { git = "https://github.com/hal-c2/ljos-ui", rev = "53157b350adbbf8f7e3e3a7d7b961f7a45c03295" }
ljos_secrets = { git = "https://github.com/hal-c2/ljos-ui", rev = "53157b350adbbf8f7e3e3a7d7b961f7a45c03295" }
# The side streams' own inbox where no ljos::Setup runs them (`--render`, the
# tests): streams::Pump. Ljós's facade hands out a Setup's streams only.
ljos_runtime = { git = "https://github.com/hal-c2/ljos-ui", rev = "53157b350adbbf8f7e3e3a7d7b961f7a45c03295" }
# `--audit`: Ljós's design audit (`ljos audit`) of the shell as it shows,
# which needs HalC2.Shell's native types the plain `ljos` command lacks.
ljos_audit = { git = "https://github.com/hal-c2/ljos-ui", rev = "53157b350adbbf8f7e3e3a7d7b961f7a45c03295" }
# The tests' host of the shell's windows (tests/features/user_shell.rs): the
# user's files laid over the app's, as `App::user_qml` lays them, and the
# roots an app puts in a window.
ljos_dev = { git = "https://github.com/hal-c2/ljos-ui", rev = "53157b350adbbf8f7e3e3a7d7b961f7a45c03295" }
ljos_quick = { git = "https://github.com/hal-c2/ljos-ui", rev = "53157b350adbbf8f7e3e3a7d7b961f7a45c03295" }
# The host of the shell's `Window` where no platform window shows it
# (`--render`, the tests), and the windows there are.
ljos_controls = { git = "https://github.com/hal-c2/ljos-ui", rev = "53157b350adbbf8f7e3e3a7d7b961f7a45c03295" }
hal_c2_mc = { path = "mc" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"


[profile.release]
codegen-units = 1
lto = "thin"
strip = true

# The Terminal's VT parser (hof_vt's libghostty-vt) is the hot path even in
# a debug build. Its build script builds Ghostty's Zig in Debug mode whenever
# cargo says DEBUG, which any debug info does (line tables too): several
# times slower, so none here. As Ljós Hof's own Cargo.toml.
[profile.dev.package.libghostty-vt-sys]
opt-level = 3
debug = false

# desktop-ljos:inspect's build: release code with its symbols and line tables
# kept, so a stack sampled from a stuck UI thread names its functions. Its own
# profile, so switching between it and a plain run does not rebuild either.
[profile.inspect]
inherits = "release"
strip = false
debug = "line-tables-only"
# Its line tables would build Ghostty's Zig in Debug mode (see above).
[profile.inspect.package.libghostty-vt-sys]
debug = false
