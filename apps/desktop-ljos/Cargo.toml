[workspace]
members = ["shell", "mc"]
resolver = "3"

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false

[workspace.dependencies]
# Pinned to a commit of hal-c2/ljos-ui. To build against a local checkout,
# add a `[patch."https://github.com/hal-c2/ljos-ui"]` to a gitignored
# .cargo/config.toml rather than editing this line.
ljos = { git = "https://github.com/hal-c2/ljos-ui", rev = "d6dfdff5c767994ac7a16a76f4f4469c5db8e97a", default-features = false }
# Behind the facade, for what it does not offer yet (shell/Cargo.toml says
# what for). Same rev as `ljos`.
ljos_engine = { git = "https://github.com/hal-c2/ljos-ui", rev = "d6dfdff5c767994ac7a16a76f4f4469c5db8e97a" }
ljos_controls = { git = "https://github.com/hal-c2/ljos-ui", rev = "d6dfdff5c767994ac7a16a76f4f4469c5db8e97a" }
ljos_quick = { git = "https://github.com/hal-c2/ljos-ui", rev = "d6dfdff5c767994ac7a16a76f4f4469c5db8e97a" }
ljos_platform = { git = "https://github.com/hal-c2/ljos-ui", rev = "d6dfdff5c767994ac7a16a76f4f4469c5db8e97a" }
ljos_runtime = { git = "https://github.com/hal-c2/ljos-ui", rev = "d6dfdff5c767994ac7a16a76f4f4469c5db8e97a" }
hal_c2_mc = { path = "mc" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"


[profile.release]
codegen-units = 1
lto = "thin"
strip = true
