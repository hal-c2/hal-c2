[workspace]
members = ["shell", "mc"]
resolver = "3"

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false

[workspace.dependencies]
# Pinned to a commit of hal-c2/ljos-ui. To build against a local checkout,
# add a `[patch."https://github.com/hal-c2/ljos-ui"]` to a gitignored
# .cargo/config.toml rather than editing this line.
ljos = { git = "https://github.com/hal-c2/ljos-ui", rev = "bc7961b0f3b22a7a2ffe5a257c3b38d066222133", default-features = false }
hal_c2_mc = { path = "mc" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"


[profile.release]
codegen-units = 1
lto = "thin"
strip = true

# desktop-ljos:inspect's build: release code with its symbols and line tables
# kept, so a stack sampled from a stuck UI thread names its functions. Its own
# profile, so switching between it and a plain run does not rebuild either.
[profile.inspect]
inherits = "release"
strip = false
debug = "line-tables-only"
