[workspace]
members = ["shell", "mc"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false

[workspace.dependencies]
# Pinned to a commit of hal-c2/ljos-ui. To build against a local checkout,
# add a `[patch."https://github.com/hal-c2/ljos-ui"]` to a gitignored
# .cargo/config.toml rather than editing this line.
ljos = { git = "https://github.com/hal-c2/ljos-ui", rev = "1eba260ed1e9cf61b364ae6442b595abb132880d", default-features = false }
# Behind the facade, for what it does not offer yet (shell/src/qml.rs and
# shell/src/render.rs say what for). Same rev as `ljos`.
ljos_compiler = { git = "https://github.com/hal-c2/ljos-ui", rev = "1eba260ed1e9cf61b364ae6442b595abb132880d" }
# The QmlObject derive and qml_impl name `::ljos_engine`, which a `pub use`
# through the facade does not make resolve: only a direct dependency does.
ljos_engine = { git = "https://github.com/hal-c2/ljos-ui", rev = "1eba260ed1e9cf61b364ae6442b595abb132880d" }
ljos_platform = { git = "https://github.com/hal-c2/ljos-ui", rev = "1eba260ed1e9cf61b364ae6442b595abb132880d" }
ljos_a11y = { git = "https://github.com/hal-c2/ljos-ui", rev = "1eba260ed1e9cf61b364ae6442b595abb132880d" }
ljos_controls = { git = "https://github.com/hal-c2/ljos-ui", rev = "1eba260ed1e9cf61b364ae6442b595abb132880d" }
ljos_quick = { git = "https://github.com/hal-c2/ljos-ui", rev = "1eba260ed1e9cf61b364ae6442b595abb132880d" }
ljos_render = { git = "https://github.com/hal-c2/ljos-ui", rev = "1eba260ed1e9cf61b364ae6442b595abb132880d", default-features = false }
ljos_text = { git = "https://github.com/hal-c2/ljos-ui", rev = "1eba260ed1e9cf61b364ae6442b595abb132880d" }
ljos_runtime = { git = "https://github.com/hal-c2/ljos-ui", rev = "1eba260ed1e9cf61b364ae6442b595abb132880d" }
hal_c2_mc = { path = "mc" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"


[profile.release]
codegen-units = 1
lto = "thin"
strip = true
