[package]
name = "hal_c2_shell"
description = "The HAL-C2 desktop shell on Ljós: the native HalC2.Shell module and its controllers."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "hal-c2-ljos"
path = "src/main.rs"

[dependencies]
# dev-qml: the shell compiles its QML at start-up (see src/qml.rs for why).
# No `media`: the bricks play nothing.
ljos = { workspace = true, features = ["shell", "dev-qml"] }
# The system colour scheme's type, which ljos_quick returns but does not name.
ljos_a11y.workspace = true
ljos_compiler.workspace = true
ljos_controls.workspace = true
# For the paths the QmlObject derive generates (see the workspace manifest).
ljos_engine.workspace = true
# The clipboard's mode, which the facade does not name.
ljos_platform.workspace = true
ljos_quick.workspace = true
ljos_render.workspace = true
ljos_runtime.workspace = true
hal_c2_mc.workspace = true
# The system's handler for links (Ljós has no openUrlExternally yet).
open = "5"
# The kept session (src/session.rs).
serde.workspace = true
serde_json.workspace = true
# The MC origin, as hal_c2_mc takes it.
url = "2"
# Project and provider helpers: names, monograms, instance ids and the QR code of a pairing link.
qrcodegen = "1"
# One running shell per home (src/single_instance.rs): a local socket.
interprocess = "2"
unicode-general-category = "1"
unicode-normalization = "0.1"
# The client cache (src/cache.rs), as desktop-qt's LocalCache over QtSql's SQLite.
rusqlite = { version = "0.40", features = ["bundled"] }
# The sidebar's times (src/sidebar_model.rs): ISO dates and local wall clocks.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
proptest = "1.11"
tempfile = "3"
