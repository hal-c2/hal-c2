[package]
name = "hal_c2_shell"
description = "The HAL-C2 desktop shell on Ljós: the native HalC2.Shell module and its controllers."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "hal-c2-ljos"
path = "src/main.rs"

[features]
# Ljós's inspector, served when LJOS_MCP names its capabilities (README,
# "Inspect").
mcp = ["ljos/mcp"]

[dependencies]
# dev-qml: the shell compiles its QML at start-up (the README says why).
# render: `--render`. media: the Device tab's screen is decoded with Ljós's
# stream decoder (src/device/decoder.rs).
ljos = { workspace = true, features = ["shell", "dev-qml", "render", "media"] }
hal_c2_mc.workspace = true
# The kept session (src/session.rs).
serde.workspace = true
serde_json.workspace = true
# The MC origin, as hal_c2_mc takes it.
url = "2"
# Project and provider helpers: names, monograms, instance ids and the QR code of a pairing link.
qrcodegen = "1"
# One running shell per home (src/single_instance.rs): a local socket.
interprocess = "2"
unicode-general-category = "1"
unicode-normalization = "0.1"
# The client cache (src/cache.rs), as desktop-qt's LocalCache over QtSql's SQLite.
rusqlite = { version = "0.40", features = ["bundled"] }
# The sidebar's times (src/sidebar_model.rs): ISO dates and local wall clocks.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
iana-time-zone = "0.1"
# The plugins' files the MC sends (controllers/mc_plugin.rs).
base64 = "0.23"
# The local folder browser (src/folders): watching folders and moving files to the trash.
notify = "8"
trash = "5"
# The composer's Markdown markers (src/highlighter.rs), as desktop-qt's QRegularExpression.
fancy-regex = "0.19"
# The Terminal item's escape-sequence parser and screen (see terminal/mod.rs).
vt100 = "0.16"
# The thread view (thread_view/): desktop-qt's QRegularExpression patterns
# and QTextDocument's markdown as text.
regex = "1"
pulldown-cmark = { version = "0.13", default-features = false }
# The Device tab's screen (src/device): serve-sim's JPEG seed is decoded as
# Ljós's Image does.
zune-jpeg = "0.5"

# The composer's attachment thumbnails (controllers/composer/attachments.rs),
# as desktop-qt's QImage: the pictures a prompt carries are PNG or JPEG.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# The transcription helper's session and its signals (src/local_transcriber).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# System notifications (src/notifications.rs). Already built for Ljós's
# accessibility; notify-rust's one-handle-per-notification wait cannot hear
# a click on an older notification, nor close them all.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[dev-dependencies]
# `testing`: a window without a platform, on a virtual clock, to show items
# in and hand them input.
ljos = { workspace = true, features = ["testing"] }
# The state machine properties (tests/hub, the store and cache properties).
proptest = "1.11"
# The fake notification service's signal bodies (tests/notifications.rs).
serde.workspace = true
tempfile = "3"
